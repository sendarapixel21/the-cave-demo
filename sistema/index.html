<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Cave · Cave Agenda — Demo del sistema</title>
<style>
/* ============================================================
   1. TOKENS — tema claro por defecto, oscuro con [data-theme=dark]
   ============================================================ */
:root{
  --bg:#f6f2ea; --surface:#ffffff; --surface-2:#fbf8f2; --surface-3:#f1ece2;
  --line:#e2dbcd; --line-2:#d2c9b7; --ink:#1b1814; --ink-2:#3d372f; --muted:#6b645a;
  --gold:#c9a15a; --gold-d:#8a6420; --gold-soft:rgba(201,161,90,.16);
  --ok:#2f7d46; --ok-soft:rgba(47,125,70,.13);
  --warn:#a9762a; --warn-soft:rgba(169,118,42,.14);
  --danger:#b4472f; --danger-soft:rgba(180,71,47,.12);
  --info:#41628f; --info-soft:rgba(65,98,143,.12);
  --shadow:0 1px 2px rgba(27,24,20,.05), 0 12px 28px -18px rgba(27,24,20,.35);
  --shadow-lg:0 24px 70px -30px rgba(27,24,20,.45);
  --r:8px; --r-sm:6px;
  --cal-h:760px;
}
html[data-theme="dark"]{
  --bg:#0e0d0c; --surface:#181614; --surface-2:#141210; --surface-3:#1e1b18;
  --line:#2b2825; --line-2:#3a352e; --ink:#f1ece4; --ink-2:#d8d2c8; --muted:#a09a90;
  --gold:#c9a15a; --gold-d:#e0bd7f; --gold-soft:rgba(201,161,90,.14);
  --ok:#6ea77f; --ok-soft:rgba(110,167,127,.14);
  --warn:#d8a15a; --warn-soft:rgba(216,161,90,.14);
  --danger:#d98b72; --danger-soft:rgba(217,139,114,.13);
  --info:#8e9ec7; --info-soft:rgba(142,158,199,.14);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 18px 40px -24px rgba(0,0,0,.9);
  --shadow-lg:0 30px 80px -30px rgba(0,0,0,.95);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 14px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
h1,h2,h3,h4,h5{margin:0;font-weight:600;line-height:1.25}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold-d);text-decoration:none}
.mono{font-family:"Cascadia Mono",Consolas,monospace;font-size:12px;letter-spacing:.02em}
.hidden{display:none!important}
.muted{color:var(--muted)}
.mini{font-size:12px}

/* ============================================================
   2. SHELL: topbar + sidebar + main
   ============================================================ */
.app{display:grid;grid-template-rows:56px 1fr;height:100vh}
.topbar{
  display:flex;align-items:center;gap:16px;padding:0 16px;
  background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:20;
}
.brand{display:flex;align-items:center;gap:10px;padding-right:16px;border-right:1px solid var(--line);height:100%}
.brand .logo{width:32px;height:32px;border-radius:7px;background:var(--ink);color:var(--bg);
  display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.04em}
.brand b{font-size:14.5px;letter-spacing:.02em}
.brand span{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.branch-chip{
  display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line-2);
  border-radius:99px;background:var(--surface-2);font-size:13px;font-weight:500;white-space:nowrap
}
.branch-chip i{width:6px;height:6px;border-radius:50%;background:var(--ok);display:block}
.branch-chip select{border:0;background:transparent;font-weight:600;font-size:13px;padding:0;outline:none;color:inherit}
.grow{flex:1}
.clock{font-size:13px;color:var(--muted);white-space:nowrap}
.clock b{color:var(--ink);font-weight:600}
.role-switch{display:flex;align-items:center;gap:6px;padding:4px;background:var(--surface-3);border-radius:99px;border:1px solid var(--line)}
.role-switch button{padding:5px 12px;border-radius:99px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.role-switch button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.icon-btn{width:34px;height:34px;border-radius:var(--r-sm);border:1px solid var(--line);
  display:grid;place-items:center;background:var(--surface);font-size:15px;color:var(--ink-2)}
.icon-btn:hover{border-color:var(--line-2);background:var(--surface-2)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--gold-soft);color:var(--gold-d);
  display:grid;place-items:center;font-weight:600;font-size:12.5px;border:1px solid var(--line)}

.body{display:grid;grid-template-columns:236px 1fr;min-height:0}
.sidebar{
  background:var(--surface-2);border-right:1px solid var(--line);display:flex;flex-direction:column;
  min-height:0;overflow:hidden
}
.side-head{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.side-head b{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.side-head p{margin:4px 0 0;font-size:12.5px;color:var(--ink-2);font-weight:600}
.nav{flex:1;overflow-y:auto;padding:10px 8px}
.nav .grp{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  padding:14px 10px 6px;font-weight:600}
.nav button{
  display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:var(--r-sm);
  font-size:13.5px;color:var(--ink-2);text-align:left;margin-bottom:2px
}
.nav button .ic{width:18px;text-align:center;opacity:.8;font-size:14px}
.nav button:hover{background:var(--surface-3)}
.nav button.on{background:var(--gold-soft);color:var(--gold-d);font-weight:600}
.nav button.on .ic{opacity:1}
.nav button .lock{margin-left:auto;font-size:10px;color:var(--muted);opacity:.9}
.nav button:disabled{opacity:.42;cursor:not-allowed}
.side-foot{padding:10px 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);display:grid;gap:4px}
.side-foot div{display:flex;justify-content:space-between;gap:8px}

.main{overflow-y:auto;min-height:0;background:var(--bg);position:relative}
.page{padding:20px 22px 40px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.page-head h2{font-size:19px;letter-spacing:.01em}
.page-head p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ============================================================
   3. COMPONENTES
   ============================================================ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;
  border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);font-size:13px;
  font-weight:500;color:var(--ink);white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.btn.primary:hover{filter:brightness(1.14)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#17120a;font-weight:600}
.btn.gold:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn.danger{color:var(--danger);border-color:var(--line-2)}
.btn.block{width:100%}
.seg{display:inline-flex;padding:3px;background:var(--surface-3);border:1px solid var(--line);border-radius:var(--r-sm)}
.seg button{padding:5px 12px;border-radius:4px;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.field{display:grid;gap:5px}
.field > label{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.input,input.input,select.input,textarea.input{
  height:36px;padding:0 11px;border:1px solid var(--line-2);border-radius:var(--r-sm);
  background:var(--surface);font-size:13.5px;outline:none;width:100%
}
textarea.input{height:auto;padding:9px 11px;resize:vertical;min-height:64px}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-h h3{font-size:13.5px}
.card-b{padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{display:block;font-size:24px;line-height:1.1;letter-spacing:-.02em}
.stat span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.stat .sub{font-size:12px;color:var(--muted);margin-top:3px;text-transform:none;letter-spacing:0;font-weight:400}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;
  font-size:11px;font-weight:600;letter-spacing:.03em;border:1px solid transparent;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.danger{background:var(--danger-soft);color:var(--danger)}
.badge.info{background:var(--info-soft);color:var(--info)}
.badge.gold{background:var(--gold-soft);color:var(--gold-d)}
.badge.plain{background:var(--surface-3);color:var(--muted);border-color:var(--line)}
.badge i{width:5px;height:5px;border-radius:50%;background:currentColor;display:block}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;padding:9px 12px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);border-bottom:1px solid var(--line);background:var(--surface-2);font-weight:600}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .right{text-align:right}
.tbl .c{text-align:center}
.empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:13px}
.note{border-left:3px solid var(--gold);background:var(--gold-soft);padding:11px 14px;border-radius:0 6px 6px 0;font-size:12.5px;color:var(--ink-2)}
.note.info{border-color:var(--info);background:var(--info-soft)}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:12.5px}
.switch input{appearance:none;width:34px;height:19px;border-radius:99px;background:var(--line-2);
  position:relative;cursor:pointer;transition:background .15s;border:0}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;
  background:#fff;transition:transform .15s}
.switch input:checked{background:var(--gold)}
.switch input:checked::after{transform:translateX(15px)}

/* ============================================================
   4. CALENDARIO (columnas por barbero)
   ============================================================ */
.cal-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.cal-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--surface)}
.cal-bar .date-nav{display:flex;align-items:center;gap:4px}
.cal-bar .date-nav button{width:28px;height:28px;border-radius:var(--r-sm);border:1px solid var(--line);display:grid;place-items:center;background:var(--surface);font-size:13px}
.cal-bar .date-nav button:hover{background:var(--surface-2)}
.cal-bar .date-label{font-weight:600;font-size:14px;padding:0 8px;min-width:210px}
.cal-bar .date-label small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.cal-legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);align-items:center;flex-wrap:wrap}
.cal-legend span{display:inline-flex;align-items:center;gap:5px}
.cal-legend i{width:8px;height:8px;border-radius:2px;display:block}
.cal-scroll{overflow:auto;max-height:calc(100vh - 296px);min-height:460px;overscroll-behavior:contain}
.cal{display:grid;grid-template-columns:62px repeat(var(--cols,4),minmax(180px,1fr));min-width:100%}
.cal-head{position:sticky;top:0;z-index:6;background:var(--surface);border-bottom:1px solid var(--line)}
.cal-head .cell{padding:8px 10px;border-left:1px solid var(--line);min-height:52px}
.cal-head .cell:first-child{border-left:0;background:var(--surface-2);display:grid;place-items:center;font-size:10.5px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.barber-name{display:flex;align-items:center;gap:8px}
.barber-name .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;
  background:var(--gold-soft);color:var(--gold-d);flex:0 0 auto}
.barber-name b{font-size:12.5px;display:block;line-height:1.2}
.barber-name small{font-size:10.5px;color:var(--muted);display:flex;gap:5px;align-items:center}
.tag{font-size:9.5px;padding:1px 5px;border-radius:3px;letter-spacing:.05em;text-transform:uppercase;
  border:1px solid var(--line-2);color:var(--muted);font-weight:600;background:var(--surface-2)}
.tag.rot{border-color:var(--gold);color:var(--gold-d);background:var(--gold-soft)}
.cal-axis{position:relative;border-right:1px solid var(--line);background:var(--surface-2)}
.cal-axis div{position:absolute;right:8px;font-size:10.5px;color:var(--muted);transform:translateY(-50%);white-space:nowrap}
.cal-col{position:relative;border-left:1px solid var(--line);height:var(--cal-h)}
.cal-col.off{background:repeating-linear-gradient(135deg,transparent 0 8px,var(--surface-2) 8px 16px)}
.cal-lines{position:absolute;inset:0;pointer-events:none}
.cal-lines i{position:absolute;left:0;right:0;border-top:1px solid var(--line);opacity:.65}
.cal-lines i.half{border-top-style:dashed;opacity:.35}
.slot{position:absolute;left:0;right:0;height:26.6px;z-index:1}
.slot:hover{background:var(--gold-soft);cursor:pointer}
.ev{position:absolute;left:4px;right:4px;border-radius:5px;padding:4px 6px 4px 7px;font-size:11px;line-height:1.25;
  overflow:hidden;cursor:pointer;border:1px solid var(--line-2);border-left-width:3px;background:var(--surface);
  box-shadow:0 1px 2px rgba(0,0,0,.06);z-index:3}
.ev:hover{filter:brightness(.985);box-shadow:var(--shadow)}
.ev b{display:block;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev small{color:var(--muted);font-size:10px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .t{font-variant-numeric:tabular-nums;font-weight:600;font-size:10px;color:var(--muted)}
.ev.confirmada{border-left-color:var(--ok)}
.ev.pendiente{border-left-color:var(--gold)}
.ev.curso{border-left-color:var(--info)}
.ev.atendida{border-left-color:var(--muted)}
.ev.cancelada{border-left-color:var(--danger);opacity:.75;text-decoration:line-through}
.ev.noshow{border-left-color:var(--danger)}
.ev.bloqueo{background:var(--surface-3);border-left-color:var(--info);border-style:dashed;text-align:center;
  display:grid;place-items:center;font-size:10.5px;color:var(--muted)}
.ev.bloqueo b{font-size:10.5px;color:var(--ink-2)}
.week .cal{grid-template-columns:62px repeat(7,minmax(120px,1fr))}
.week-col{position:relative;border-left:1px solid var(--line);height:var(--cal-h)}
.week-head{padding:8px;text-align:center;border-left:1px solid var(--line);font-size:12px}
.week-head b{display:block;font-size:12.5px}
.week-head small{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em}
.week-head.today{background:var(--gold-soft)}
.ev.mini{font-size:10px;padding:3px 5px;border-left-width:2px}

/* ============================================================
   5. MODALES, DRAWER, TOASTS, OVERLAYS
   ============================================================ */
.scrim{position:fixed;inset:0;background:rgba(20,18,16,.5);backdrop-filter:blur(2px);z-index:60;
  display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .14s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);
  width:100%;max-width:820px;max-height:calc(100vh - 60px);display:flex;flex-direction:column;animation:pop .16s ease}
.modal.sm{max-width:460px}
.modal.lg{max-width:980px}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:15px}
.modal-h p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.modal-b{padding:18px;overflow-y:auto;display:grid;gap:14px}
.modal-f{padding:13px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--surface-2);border-radius:0 0 12px 12px}
.x{width:30px;height:30px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--muted);font-size:16px}
.x:hover{background:var(--surface-3);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:6px 11px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);
  font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.chip:hover{border-color:var(--gold)}
.chip.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-d);font-weight:600}
.chip small{color:var(--muted);font-size:11px}
.chip.on small{color:var(--gold-d)}
.pick{display:grid;gap:6px;max-height:190px;overflow-y:auto;border:1px solid var(--line);border-radius:var(--r-sm);padding:6px;background:var(--surface-2)}
.pick button{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:5px;font-size:13px;text-align:left}
.pick button:hover{background:var(--surface-3)}
.pick button.on{background:var(--gold-soft);color:var(--gold-d);font-weight:600}
.summary{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;display:grid;gap:6px;font-size:13px}
.summary div{display:flex;justify-content:space-between;gap:12px}
.summary div.total{border-top:1px dashed var(--line-2);padding-top:8px;margin-top:2px;font-weight:700;font-size:14px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:92vw;background:var(--surface);
  border-left:1px solid var(--line);box-shadow:var(--shadow-lg);z-index:70;display:flex;flex-direction:column;animation:slide .18s ease}
@keyframes slide{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
.drawer .modal-b{flex:1}
.toasts{position:fixed;right:18px;bottom:88px;z-index:120;display:grid;gap:8px;justify-items:end}
.fab{position:fixed;right:22px;bottom:22px;width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--bg);
  display:grid;place-items:center;font-size:24px;line-height:1;box-shadow:var(--shadow-lg);z-index:40;border:1px solid var(--line-2)}
.fab:hover{filter:brightness(1.18)}
.toast{background:var(--ink);color:var(--bg);border-radius:8px;padding:10px 14px;font-size:12.5px;
  box-shadow:var(--shadow-lg);display:flex;gap:9px;align-items:center;animation:pop .16s ease;max-width:360px}
html[data-theme="dark"] .toast{background:var(--surface-3);color:var(--ink);border:1px solid var(--line-2)}
.toast .d{width:7px;height:7px;border-radius:50%;background:var(--gold);flex:0 0 auto}
.toast.ok .d{background:var(--ok)}
.toast.err .d{background:var(--danger)}

/* Onboarding / login */
.screen{position:fixed;inset:0;z-index:100;background:
  radial-gradient(ellipse at 78% 8%,var(--gold-soft),transparent 55%),var(--bg);
  display:grid;place-items:center;padding:24px;overflow:auto}
.screen-inner{width:100%;max-width:880px}
.screen .kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-d);font-weight:700}
.screen h1{font-size:clamp(26px,3.6vw,38px);margin:10px 0 8px;letter-spacing:-.01em}
.screen p.sub{color:var(--muted);font-size:14px;margin:0 0 22px;max-width:60ch}
.branch-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}

.qr i{background:#fff}
.qr i.b{background:#141210}
.progress{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.progress > i{display:block;height:100%;background:var(--gold);width:0;transition:width .25s ease}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted);font-size:12px}
.kv dd{margin:0;font-weight:500}

.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}

/* ---------- helpers ---------- */
function iso(d){ var y=d.getFullYear(), m=('0'+(d.getMonth()+1)).slice(-2), dd=('0'+d.getDate()).slice(-2); return y+'-'+m+'-'+dd; }
function parseISO(s){ var p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function addDays(s,n){ var d=parseISO(s); d.setDate(d.getDate()+n); return iso(d); }
var DN=['dom','lun','mar','mié','jue','vie','sáb'];
var MN=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
var DNX=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var MNX=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function fmtDay(s){ var d=parseISO(s); return DN[d.getDay()]+' '+d.getDate()+' '+MN[d.getMonth()]; }
function fmtLong(s){ var d=parseISO(s); return DNX[d.getDay()]+', '+d.getDate()+' de '+MNX[d.getMonth()]; }
function hhmm(m){ var h=Math.floor(m/60), mm=m%60; return ('0'+h).slice(-2)+':'+('0'+mm).slice(-2); }
function money(n){ return '$'+n.toFixed(2); }
function initials(n){ return n.split(' ').map(function(x){return x[0];}).join('').slice(0,2).toUpperCase(); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function byId(id){ return document.getElementById(id); }
function uid(p){ return p+'-'+Math.random().toString(36).slice(2,8); }
function barber(id){ return S.barbers.find(function(b){return b.id===id;}); }
function client(id){ return S.clients.find(function(c){return c.id===id;}); }
function service(id){ return S.services.find(function(s){return s.id===id;}); }
function stamp(){ var d=new Date(); return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
function userLabel(){ return S.role==='admin' ? 'Edwin G. · Admin' : 'Paola S. · Anfitriona'; }
function branchName(id){ var b=BRANCHES[id]; return b?b.name:'—'; }

/* ---------- agenda por sucursal / día ---------- */
function rotOn(date, branchId){
  return (S.rotation[date]||[]).filter(function(r){ return r.branch===branchId; }).map(function(r){ return r.barber; });
}
function isOff(barberId, date){ return S.daysOff.some(function(d){ return d.barber===barberId && d.date===date; }); }
function present(date, branchId){
  var list = S.barbers.filter(function(b){ return b.branch===branchId; }).map(function(b){ return b.id; });
  rotOn(date, branchId).forEach(function(id){ if(list.indexOf(id)<0) list.push(id); });
  return list.filter(function(id){ return !isOff(id, date); });
}
function apptsOf(date, branchId){ return S.appts.filter(function(a){ return a.date===date && a.branch===branchId; }); }
function blocksOf(date, branchId){ return S.blocks.filter(function(b){ return b.date===date && b.branch===branchId; }); }
function overlaps(a, b){ return a.start < b.start+b.dur && b.start < a.start+a.dur; }
function isFree(barberId, date, branchId, start, dur, ignoreId){
  if(start < BASE || start+dur > END) return false;
  var t = {start:start, dur:dur};
  var busy = apptsOf(date, branchId).filter(function(a){ return a.barber===barberId && a.status!=='cancelada' && a.id!==ignoreId; });
  var blk = blocksOf(date, branchId).filter(function(b){ return b.barber===null || b.barber===barberId; });
  if(busy.some(function(a){ return overlaps(t, a); })) return false;
  if(blk.some(function(b){ return overlaps(t, b); })) return false;
  return true;
}
function totals(date, branchId){
  var all = apptsOf(date, branchId);
  var active = all.filter(function(a){ return a.status!=='cancelada'; });
  var mins = active.reduce(function(s,a){ return s+a.dur; }, 0);
  var cap = present(date, branchId).length * (END-BASE);
  return {citas:all.length, ingreso:active.reduce(function(s,a){ return s+priceOf(a); },0),
    ocupacion: cap ? Math.round(mins/cap*100) : 0};
}
function priceOf(a){ return a.services.reduce(function(s,id){ var x=service(id); return s+(x?x.price:0); },0); }
function durOf(ids){ return ids.reduce(function(s,id){ var x=service(id); return s+(x?x.min:0); },0); }

/* ---------- datos iniciales ---------- */
function seed(){
  var today = iso(new Date());
  var statuses = ['confirmada','confirmada','pendiente','atendida','confirmada','curso'];
  for(var i=0;i<8;i++){
    var d = addDays(today, i);
    S.rotation[d] = [{barber:'b3', branch: i%3===0?0:1}, {barber:'b7', branch: i%2===0?2:0}];
  }
  S.daysOff.push({barber:'b4', date:addDays(today,1), type:'Vacaciones'});
  S.daysOff.push({barber:'b3', date:addDays(today,3), type:'Libre'});
  S.daysOff.push({barber:'b6', date:addDays(today,4), type:'Permiso'});
  var k = 0;
  BRANCHES.forEach(function(br){
    for(var i=0;i<3;i++){
      var d = addDays(today, i);
      present(d, br.id).forEach(function(bid, bi){
        var start = BASE + 30 + ((bi*75 + i*45) % 240);
        var n = 2 + ((bi + i) % 3);
        for(var j=0;j<n;j++){
          var svc = S.services[(bi + j + i) % S.services.length];
          var extra = ((bi+j)%4===0) ? S.services[(bi+j+2)%S.services.length] : null;
          var ids = extra && extra.id!==svc.id ? [svc.id, extra.id] : [svc.id];
          var dur = durOf(ids);
          if(start + dur > END) break;
          var cl = S.clients[(k++) % S.clients.length];
          var st = i===0 ? statuses[(bi+j+i) % statuses.length] : 'confirmada';
          S.appts.push({id:uid('a'), date:d, start:start, dur:dur, barber:bid, branch:br.id,
            client:cl.id, services:ids, origin:['web','teléfono','mostrador','web'][(bi+j)%4],
            status:st, notes:'', drink:['Agua','Cerveza artesanal','No, gracias'][(bi+j)%3]});
          start += dur + 15;
        }
      });
    }
  });
  S.blocks.push({id:uid('k'), date:today, start:720, dur:45, barber:'b2', branch:0, reason:'Almuerzo', by:'Paola S. · Anfitriona'});
  S.blocks.push({id:uid('k'), date:today, start:930, dur:30, barber:null, branch:2, reason:'Capacitación interna', by:'Edwin G. · Admin'});
  S.wa = {connected:true, number:'+593 99 ••• 2841',
    messages:[
      {id:uid('m'), to:'Luis Zambrano', tpl:'Confirmación', status:'leído', hour:'09:12'},
      {id:uid('m'), to:'Andrés Vera', tpl:'Recordatorio 24 h', status:'entregado', hour:'08:40'},
      {id:uid('m'), to:'Marco Ruiz', tpl:'Recordatorio 2 h', status:'entregado', hour:'11:05'},
      {id:uid('m'), to:'Jorge Páez', tpl:'Cancelación', status:'fallido', hour:'10:22'},
      {id:uid('m'), to:'Iván Mora', tpl:'Confirmación', status:'leído', hour:'09:55'},
      {id:uid('m'), to:'Diego Salas', tpl:'Reprogramación', status:'enviado', hour:'12:03'}
    ]};
  ['Inicio de sesión','Cita creada · Luis Zambrano 10:00 · Carlos M.','Bloqueo de horario · Andrés P. 12:00-12:45',
   'Cita confirmada · Marco Ruiz','WhatsApp enviado · Confirmación a Luis Zambrano'].forEach(function(a){
    log(a, 'Paola S. · Anfitriona', 'Scala Shopping', '', true);
  });
}

function log(action, user, branchN, detail, silent){
  S.logs.unshift({ts:stamp(), user:user||userLabel(), role:S.role==='admin'?'Admin':'Anfitriona',
    branch:branchN||branchName(S.branch), device:DEVICE, action:action, detail:detail||''});
  if(!silent && S.screen==='bitacora') render();
}
/* ============================================================
   RENDER PRINCIPAL
   ============================================================ */
var NAV = [
  {id:'agenda', label:'Agenda', ic:'▤', grp:'Operación'},
  {id:'citas', label:'Citas', ic:'☰'},

  {id:'config', label:'Configuración', ic:'⚙', grp:'Sistema'}

function render(){
  var nav = '';
  NAV.forEach(function(n){
    var locked = (n.admin && S.role!=='admin') || (S.role==='hostess' && ['barberos','exportar','config'].indexOf(n.id)>=0);
    if(n.grp) nav += '<div class="grp">'+n.grp+'</div>';
    nav += '<button data-act="go" data-screen="'+n.id+'" class="'+(S.screen===n.id?'on':'')+'" '+(locked?'disabled':'')+'>'
      + '<span class="ic">'+n.ic+'</span><span>'+n.label+'</span>'
      + (locked?'<span class="lock">admin</span>':'')
      + '</button>';
  });
  byId('nav').innerHTML = nav;
  byId('branchName').textContent = branchName(S.branch);
  byId('sideBranch').textContent = branchName(S.branch)+' · '+BRANCHES[S.branch].addr;
  byId('sideUser').textContent = S.role==='admin' ? 'Edwin · Admin' : 'Paola · Anfitriona';
  byId('userAvatar').textContent = S.role==='admin' ? 'EG' : 'PS';
  byId('branchSelect').disabled = S.role!=='admin';

  var html = '';
  if(S.screen==='agenda') html = screenAgenda();
  else if(S.screen==='citas') html = screenCitas();
  else if(S.screen==='clientes') html = screenClientes();
  else if(S.screen==='barberos') html = screenBarberos();
  else if(S.screen==='bloqueos') html = screenBloqueos();
  else if(S.screen==='exportar') html = screenExportar();
  else if(S.screen==='whatsapp') html = screenWhatsapp();
  else if(S.screen==='bitacora') html = screenBitacora();
  else html = screenConfig();
  byId('main').innerHTML = '<div class="page">'+html+'</div>';
}

function head(title, sub, actions){
  return '<div class="page-head"><div><h2>'+title+'</h2><p>'+sub+'</p></div>'
    + '<div class="head-actions">'+(actions||'')+'</div></div>';
}

/* ============================================================
   AGENDA
   ============================================================ */
function screenAgenda(){
  var d = S.date, br = S.branch, t = totals(d, br), bs = present(d, br);
  var top = head('Agenda', fmtLong(d)+' · '+branchName(br),
    '<div class="seg">'
      + '<button data-act="view" data-view="day" class="'+(S.view==='day'?'on':'')+'">Día</button>'
      + '<button data-act="view" data-view="week" class="'+(S.view==='week'?'on':'')+'">Semana</button>'
    + '</div>'
    + '<button class="btn gold" data-act="new">+ Nueva cita</button>');
  var stats = '<div class="grid g4" style="margin-bottom:14px">'
    + stat(t.citas, 'Citas', 'agendadas para la fecha')
    + stat(t.ocupacion+'%', 'Ocupación', bs.length+' barberos presentes')
    + stat(money(t.ingreso), 'Ingreso estimado', 'antes de descuentos')
    + stat(bs.filter(function(id){return barber(id).type==='rotativo';}).length, 'Rotativos', 'cubriendo la sede')
    + '</div>';
  var bar = '<div class="cal-bar">'
    + '<div class="date-nav">'
      + '<button data-act="nav" data-d="-1" title="Anterior">‹</button>'
      + '<div class="date-label">'+fmtDay(d)+', '+parseISO(d).getFullYear()+'<small>'+fmtLong(d)+'</small></div>'
      + '<button data-act="nav" data-d="1" title="Siguiente">›</button>'
    + '</div>'
    + '<button class="btn sm ghost" data-act="today">Hoy</button>'
    + '<div class="grow"></div>'
    + '<div class="cal-legend">'
      + '<span><i style="background:var(--ok)"></i>Confirmada</span>'
      + '<span><i style="background:var(--gold)"></i>Pendiente</span>'
      + '<span><i style="background:var(--info)"></i>En curso</span>'
      + '<span><i style="background:var(--muted)"></i>Atendida</span>'
      + '<span><i style="background:var(--danger)"></i>Cancelada</span>'
      + '<span><i style="background:var(--info);border-radius:2px"></i>Bloqueo</span>'
    + '</div>'
    + '<button class="btn sm" data-act="refresh" title="Actualizar agenda">↻ Actualizar</button>'
  + '</div>';
  var body = S.view==='week' ? calWeek(d, br) : calDay(d, br);
  return top + stats + '<div class="cal-wrap">'+bar+'<div class="cal-scroll">'+body+'</div></div>';
}

function stat(v, l, sub){
  return '<div class="stat"><span>'+l+'</span><b>'+v+'</b><div class="sub">'+sub+'</div></div>';
}

var K = 760/555;
function px(min){ return Math.round(min*K); }
function colsStyle(n){ return 'display:grid;grid-template-columns:62px repeat('+n+',minmax(180px,1fr));min-width:'+(62+n*180)+'px'; }
function axis(){
  var h = '';
  for(var m=BASE; m<=END; m+=60){ h += '<div style="top:'+px(m-BASE)+'px">'+hhmm(m)+'</div>'; }
  return '<div class="cal-axis" style="height:760px">'+h+'</div>';
}
function lines(){

  for(var m=BASE; m<=END; m+=30){

}

function eventHTML(a, mini){
  var c = client(a.client), b = barber(a.barber);
  var svc = a.services.map(function(id){ var s=service(id); return s?s.name:''; }).join(' + ');
  var st = {confirmada:'Confirmada',pendiente:'Pendiente',curso:'En curso',atendida:'Atendida',cancelada:'Cancelada',noshow:'No asistió'}[a.status]||a.status;
  var top = px(a.start-BASE), h = Math.max(px(a.dur)-3, mini?16:22);
  return '<div class="ev '+a.status+(mini?' mini':'')+'" style="top:'+top+'px;height:'+h+'px" data-act="appt" data-id="'+a.id+'" title="'+esc(c?c.name:'')+' · '+esc(svc)+'">'
    + '<span class="t">'+hhmm(a.start)+' · '+st+'</span>'
    + '<b>'+esc(c?shortName(c.name):'—')+'</b>'
    + (h>44 ? '<small>'+esc(svc)+'</small>' : '')
    + (h>66 && !mini ? '<small>'+esc(b?b.name:'')+' · '+a.origin+'</small>' : '')
  + '</div>';
}
function blockHTML(k, mini){
  var top = px(k.start-BASE), h = Math.max(px(k.dur)-3, 16);
  return '<div class="ev bloqueo'+(mini?' mini':'')+'" style="top:'+top+'px;height:'+h+'px"><b>'+esc(k.reason)+'</b></div>';

function calDay(d, br){
  var bs = present(d, br);
  if(!bs.length) return '<div class="empty">No hay barberos asignados a esta sede en esa fecha.<br><span class="mini">El administrador puede asignar un rotativo en Barberos y días libres.</span></div>';
  var h = '<div class="cal-head" style="'+colsStyle(bs.length)+'"><div class="cell">Hora</div>';
  bs.forEach(function(id){
    var b = barber(id), rot = b.type==='rotativo';
    h += '<div class="cell"><div class="barber-name"><div class="av">'+initials(b.name)+'</div>'
      + '<div><b>'+b.name+'</b><small>'+(rot?'rotativo · de '+branchName(b.branch):'fijo')+'</small></div></div></div>';
  });
  h += '</div><div style="'+colsStyle(bs.length)+'">' + axis();
  bs.forEach(function(id){
    h += '<div class="cal-col">'+lines();
    for(var m=BASE; m<END; m+=SLOTS){
      h += '<div class="slot" style="top:'+px(m-BASE)+'px;height:'+px(SLOTS)+'px" data-act="slot" data-barber="'+id+'" data-start="'+m+'"></div>';
    }
    apptsOf(d, br).filter(function(a){ return a.barber===id; }).forEach(function(a){ h += eventHTML(a); });
    blocksOf(d, br).filter(function(k){ return k.barber===null || k.barber===id; }).forEach(function(k){ h += blockHTML(k); });
    h += '</div>';
  });
  return h + '</div>';
}

function calWeek(d, br){
  var start = parseISO(d);
  start.setDate(start.getDate() - ((start.getDay()+6)%7));
  var days = [], todayIso = iso(new Date());
  for(var i=0;i<7;i++){ var x=new Date(start); x.setDate(x.getDate()+i); days.push(iso(x)); }
  var h = '<div class="cal-head" style="'+colsStyle(7)+'"><div class="cell">Hora</div>';
  days.forEach(function(day){
    var dt = parseISO(day);
    h += '<div class="cell week-head '+(day===todayIso?'today':'')+'"><small>'+DN[dt.getDay()]+'</small><b>'+dt.getDate()+' '+MN[dt.getMonth()]+'</b></div>';
  });
  h += '</div><div style="'+colsStyle(7)+'">' + axis();
  days.forEach(function(day){
    h += '<div class="week-col" data-act="gotoday" data-day="'+day+'" title="Ver el día">'+lines();
    apptsOf(day, br).forEach(function(a){ h += eventHTML(a, true); });
    blocksOf(day, br).forEach(function(k){ h += blockHTML(k, true); });
    h += '</div>';
  });
  return h + '</div>';
}

function newDraft(pre){

function barbersFor(day){ return present(day, S.branch); }
function freeStarts(){
  var d = S.draft, dur = Math.max(15, durOf(d.services) || 15), arr = [];
  for(var m=BASE; m+dur<=END; m+=SLOTS){
    var free = d.barber ? isFree(d.barber, d.date, S.branch, m, dur, d.id)
      : barbersFor(d.date).some(function(id){ return isFree(id, d.date, S.branch, m, dur, d.id); });
    if(free) arr.push(m);
  }
  return arr;
}
function timeOptions(){
  var d = S.draft, arr = freeStarts();
  if(!arr.length){ d.start = null; return '<option value="">sin horas disponibles</option>'; }
  if(d.start === null || arr.indexOf(d.start) < 0) d.start = arr[0];
  return arr.map(function(m){ return '<option value="'+m+'" '+(d.start===m?'selected':'')+'>'+hhmm(m)+'</option>'; }).join('');

/* ============================================================
   QR DE WHATSAPP
   ============================================================ */
var qrTimer = null;
function openQR(){
  var cells = '';
  for(var y=0; y<21; y++){
    for(var x=0; x<21; x++){
      var corner = (x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);
      var on = corner ? ((x===0||x===6||y===0||y===6||(x>1&&x<5&&y>1&&y<5)||(x>1&&x<5&&y>13&&y<17)||(x>13&&x<17&&y>1&&y<5)) ? 1 : 0) : ((x*7+y*13+((x*y)%5))%3===0?1:0);
      cells += '<i class="'+(on?'b':'')+'"></i>';
    }
  }
  var body = '<div style="display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap">'
    + '<div class="qr">'+cells+'</div>'
    + '<div style="flex:1;min-width:200px;display:grid;gap:10px">'
      + '<div class="field"><label>Paso 1</label><div class="mini">Abre WhatsApp en el teléfono de la sede.</div></div>'
      + '<div class="field"><label>Paso 2</label><div class="mini">Menú → Dispositivos vinculados → Vincular dispositivo.</div></div>'
      + '<div class="field"><label>Paso 3</label><div class="mini">Escanea este código. La sesión queda cifrada en el servidor.</div></div>'
      + '<div class="progress"><i id="qrBar" style="width:100%"></i></div>'
      + '<div class="mini muted" id="qrCount">El código caduca en 40 s</div>'
      + '<button class="btn gold" data-act="qrscan">Simular escaneo correcto</button>'
    + '</div></div>';
  overlay(modalWrap('Vincular WhatsApp','Sede: '+branchName(S.branch), body, '', 'lg'));
  var left = 40;
  clearInterval(qrTimer);
  qrTimer = setInterval(function(){
    left--;
    var bar = byId('qrBar'), c = byId('qrCount');
    if(!bar){ clearInterval(qrTimer); return; }
    bar.style.width = Math.max(0,left/40*100)+'%';
    c.textContent = left>0 ? ('El código caduca en '+left+' s') : 'Código caducado · genera uno nuevo';
    if(left<=0) clearInterval(qrTimer);
  }, 1000);
}

function setRotation(val, date){
  var list = (S.rotation[date]||[]).filter(function(r){ return r.branch!==S.branch; });
  if(val) list.push({barber:val, branch:S.branch});
  S.rotation[date]=list;
  var b = val?barber(val):null;
  log(b ? ('Rotativo asignado · '+b.name+' → '+branchName(S.branch)) : ('Rotativo removido · '+fmtDay(date)),
      userLabel(), branchName(S.branch), fmtDay(date));
  toast(b ? (b.name+' cubre '+branchName(S.branch)+' el '+fmtDay(date)) : 'Rotativo removido', 'ok');
  render();
}
function updateResults(){
  var box = byId('newResults'); if(!box || !S.draft) return;
  var qq = S.draft.q.toLowerCase();
  var res = S.clients.filter(function(c){
    return !qq || c.name.toLowerCase().indexOf(qq)>=0 || c.dni.indexOf(qq)>=0 || c.phone.indexOf(qq)>=0;
  }).slice(0,5);
  box.innerHTML = res.length ? res.map(function(c){
    return '<button data-act="pickclient" data-id="'+c.id+'"><span>'+esc(c.name)+'<span class="mini muted"> · '+c.dni+'</span></span><span class="mini muted">'+c.phone+'</span></button>';
  }).join('') : '<div class="empty" style="padding:14px">Sin coincidencias</div>';
}
function saveNew(){
  var d = S.draft;
  if(!d || !d.client || !d.services.length || d.start===null){ toast('Completa cliente, servicios y hora','err'); return; }
  var dur = durOf(d.services);
  if(!d.barber){
    d.barber = barbersFor(d.date).filter(function(id){ return isFree(id, d.date, S.branch, d.start, dur, d.id); })[0] || '';
    if(!d.barber){ toast('No hay barbero libre en ese horario','err'); return; }
  }
  if(!isFree(d.barber, d.date, S.branch, d.start, dur, d.id)){ toast('Ese horario ya está ocupado o bloqueado','err'); return; }
  var c = client(d.client);
  if(d.edit){
    var a = apptById(d.id);
    var before = hhmm(a.start)+' · '+barber(a.barber).name;
    a.date=d.date; a.start=d.start; a.dur=dur; a.barber=d.barber; a.services=d.services.slice();
    a.origin=d.origin; a.notes=d.notes; a.drink=d.drink; a.status='confirmada';
    log('Cita reprogramada · '+c.name, userLabel(), branchName(S.branch), before+' → '+hhmm(a.start)+' · '+barber(a.barber).name);
    toast('Cita reprogramada y aviso enviado por WhatsApp','ok');
  } else {
    S.appts.push({id:uid('a'), date:d.date, start:d.start, dur:dur, barber:d.barber, branch:S.branch,
      client:d.client, services:d.services.slice(), origin:d.origin, notes:d.notes, drink:d.drink,
      status: d.origin==='web' ? 'pendiente' : 'confirmada'});
    S.wa.messages.unshift({id:uid('m'), to:c.name, tpl:'Confirmación', status:'enviado', hour:hhmm(new Date().getHours()*60+new Date().getMinutes())});
    log('Cita creada · '+c.name+' '+hhmm(d.start)+' · '+barber(d.barber).name, userLabel(), branchName(S.branch), 'origen: '+d.origin);
    toast('Cita creada y confirmación enviada por WhatsApp','ok');
  }
  closeOverlay(); render();
}
function setStatus(id, st){
  var a = apptById(id); if(!a) return;

  var label = {confirmada:'confirmada', atendida:'atendida', noshow:'marcada como no asistió'}[st]||st;
  log('Cita '+label+' · '+(client(a.client)?client(a.client).name:''), userLabel(), branchName(a.branch), hhmm(a.start)+' · '+(barber(a.barber)?barber(a.barber).name:''));

}

  log('Cita cancelada · '+(client(a.client)?client(a.client).name:''), userLabel(), branchName(a.branch), 'motivo: '+reason);
  toast('Cita cancelada'+(notify?' y cliente notificado':'')+'. Cupo liberado.','ok');

    + '<table class="tbl"><thead><tr><th>Fecha</th><th>Hora</th><th>Barbero</th><th>Servicios</th><th>Estado</th></tr></thead><tbody>'
    + (rows||'<tr><td colspan="5" class="empty">Sin historial</td></tr>')+'</tbody></table>';
  overlay(modalWrap('Ficha del cliente', S.role==='admin'?'Acceso completo':'Acceso limitado', body, '<button class="btn" data-act="closeoverlay">Cerrar</button>', 'lg'));
}
function addDayOff(){
  var b = byId('offBarber').value, d = byId('offDate').value, t = byId('offType').value;
  S.daysOff.push({barber:b, date:d, type:t});
  log('Día no disponible · '+barber(b).name, userLabel(), branchName(barber(b).branch), fmtDay(d)+' · '+t);
  toast(barber(b).name+' no disponible el '+fmtDay(d),'ok');
  render();
}
function delDayOff(b, d){
  S.daysOff = S.daysOff.filter(function(o){ return !(o.barber===b && o.date===d); });
  log('Día libre liberado · '+barber(b).name, userLabel(), branchName(S.branch), fmtDay(d));
  toast('Día libre liberado','ok'); render();
}
function addBlock(){
  var d = byId('blkDate').value, b = byId('blkBarber').value || null,
      s = +byId('blkStart').value, dur = +byId('blkDur').value,
      r = byId('blkReason').value || 'Bloqueo';
  if(S.role!=='admin' && d !== iso(new Date())){ toast('Solo puedes bloquear horarios del día en curso','err'); return; }
  S.blocks.push({id:uid('k'), date:d, start:s, dur:dur, barber:b, branch:S.branch, reason:r, by:userLabel()});
  log('Bloqueo de horario · '+(b?barber(b).name:'toda la sede'), userLabel(), branchName(S.branch), fmtDay(d)+' '+hhmm(s)+'-'+hhmm(s+dur));
  toast('Bloqueo creado','ok'); render();
}
function delBlock(id){
  S.blocks = S.blocks.filter(function(k){ return k.id!==id; });
  log('Bloqueo liberado', userLabel(), branchName(S.branch));
  toast('Bloqueo liberado','ok'); render();
}
function resend(id){
  S.wa.messages.forEach(function(m){ if(m.id===id) m.status='entregado'; });
  log('WhatsApp reenviado', userLabel(), branchName(S.branch));
  toast('Mensaje reenviado','ok'); render();
}
function setTheme(t){
  S.theme = t;
  document.documentElement.setAttribute('data-theme', t);
  try{ localStorage.setItem('cave-theme', t); }catch(e){}
}
function toggleTheme(){ setTheme(S.theme==='light'?'dark':'light'); toast('Tema '+(S.theme==='dark'?'oscuro':'claro')); }

/* ============================================================
   PANTALLAS DE ENTRADA
   ============================================================ */
function showOnboarding(){
  var cards = BRANCHES.map(function(b){
    return '<button class="branch-card '+(S.branch===b.id?'on':'')+'" data-act="pickbranch" data-id="'+b.id+'">'
      + '<div class="av">'+(b.id+1)+'</div><b>'+b.name+'</b><small>'+b.addr+'</small></button>';
  }).join('');
  byId('overlays').innerHTML = '<div class="screen"><div class="screen-inner">'
    + '<div class="kicker">Primera ejecución · vinculación de equipo</div>'
    + '<h1>Selecciona la sucursal de este equipo</h1>'
    + '<p class="sub">Este equipo quedará vinculado a una sola sucursal. Desde aquí solo se operará esa sede. El administrador puede revocar el equipo cuando quiera.</p>'
    + '<div class="branch-grid">'+cards+'</div>'
    + '<div class="row-flex" style="margin-top:22px">'
      + '<div class="field" style="flex:1;min-width:220px"><label>Código de activación</label><input class="input" value="CAVE-2026-0147"></div>'
      + '<button class="btn gold" data-act="link">Vincular equipo</button>'
    + '</div>'
    + '<p class="mini muted" style="margin-top:14px">Demo: el código es ficticio. En producción lo emite el panel de administración y vence a los 15 minutos.</p>'
  + '</div></div>';
}
function showLogin(){
  byId('overlays').innerHTML = '<div class="screen"><div class="screen-inner">'
    + '<div class="login-card">'
      + '<div><div class="kicker">Cave Agenda · '+branchName(S.branch)+'</div><h1 style="font-size:24px;margin-top:8px">Iniciar sesión</h1></div>'
      + '<div class="field"><label>Usuario</label><input class="input" placeholder="usuario.apellido"></div>'
      + '<div class="field"><label>Contraseña</label><input class="input" type="password" placeholder="••••••••"></div>'
      + '<button class="btn gold block" data-act="login" data-role="'+S.role+'">Entrar</button>'
      + '<div class="mini muted" style="text-align:center">— o entra con un perfil de demostración —</div>'
      + '<div class="quick">'
        + '<button data-act="login" data-role="admin"><span><b>Administrador</b><small>Edwin G. · todas las sucursales</small></span><span>→</span></button>'
        + '<button data-act="login" data-role="hostess"><span><b>Anfitriona</b><small>Paola S. · '+branchName(S.branch)+'</small></span><span>→</span></button>'
      + '</div>'
      + '<p class="mini muted">Cada turno con su propio usuario: todas las acciones quedan registradas en la bitácora.</p>'
    + '</div></div></div>';
}

/* ============================================================
   EVENTOS
   ============================================================ */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if(!el) return;
  var act = el.getAttribute('data-act');
  if(act==='scrim'){ if(e.target===el) closeOverlay(); return; }
  if(act==='go'){ S.screen = el.getAttribute('data-screen'); render(); return; }
  if(act==='view'){ S.view = el.getAttribute('data-view'); render(); return; }
  if(act==='nav'){ S.date = addDays(S.date, +el.getAttribute('data-d')); render(); return; }
  if(act==='today'){ S.date = iso(new Date()); render(); return; }
  if(act==='gotoday'){ S.date = el.getAttribute('data-day'); S.view='day'; render(); return; }
  if(act==='refresh'){ toast('Agenda sincronizada con el servidor','ok'); render(); return; }
  if(act==='new'){ openNew({date:S.date}); return; }
  if(act==='slot'){ openNew({barber:el.getAttribute('data-barber'), date:S.date, start:+el.getAttribute('data-start')}); return; }
  if(act==='appt'){ openAppt(el.getAttribute('data-id')); return; }
  if(act==='closeoverlay'){ closeOverlay(); return; }
  if(act==='pickclient'){ S.draft.client = el.getAttribute('data-id'); S.draft.q=''; renderNew(); return; }
  if(act==='cleclient'){ S.draft.client=''; renderNew(); return; }
  if(act==='svc'){
    var id = el.getAttribute('data-id'), i = S.draft.services.indexOf(id);
    if(i>=0) S.draft.services.splice(i,1); else S.draft.services.push(id);
    S.draft.start = null; renderNew(); return;
  }
  if(act==='pickbarber'){ S.draft.barber = el.getAttribute('data-id'); renderNew(); return; }
  if(act==='savenew'){ saveNew(); return; }
  if(act==='setstatus'){ setStatus(el.getAttribute('data-id'), el.getAttribute('data-st')); return; }
  if(act==='reprogram'){
    var ap = apptById(el.getAttribute('data-id'));
    if(ap){ newDraft({barber:ap.barber, date:ap.date, start:ap.start}); S.draft.id=ap.id; S.draft.edit=true; S.draft.client=ap.client; S.draft.services=ap.services.slice(); S.draft.origin=ap.origin; renderNew(); }
    return;
  }
  if(act==='cancelstart'){ openCancel(el.getAttribute('data-id')); return; }
  if(act==='canceldo'){ doCancel(el.getAttribute('data-id')); return; }
  if(act==='client'){ openClient(el.getAttribute('data-id')); return; }
  if(act==='addoff'){ addDayOff(); return; }
  if(act==='deloff'){ delDayOff(el.getAttribute('data-barber'), el.getAttribute('data-date')); return; }
  if(act==='addblock'){ addBlock(); return; }
  if(act==='delblock'){ delBlock(el.getAttribute('data-id')); return; }
  if(act==='exportrun'){ runExport(); return; }
  if(act==='qropen'){ openQR(); return; }
  if(act==='qrscan'){
    clearInterval(qrTimer); S.wa.connected = true;
    log('WhatsApp vinculado · '+branchName(S.branch), userLabel(), branchName(S.branch));
    toast('Sesión de WhatsApp vinculada','ok'); closeOverlay(); render(); return;
  }
  if(act==='wadisc'){ S.wa.connected = false; log('Sesión de WhatsApp desconectada', userLabel(), branchName(S.branch)); toast('Sesión desconectada'); render(); return; }
  if(act==='resend'){ resend(el.getAttribute('data-id')); return; }
  if(act==='logexport'){ log('Bitácora exportada', userLabel(), branchName(S.branch)); toast('Bitácora exportada a Excel','ok'); render(); return; }
  if(act==='save-config'){ log('Parámetros de la sede actualizados', userLabel(), branchName(S.branch)); toast('Configuración guardada','ok'); return; }
  if(act==='revoke'){ toast('Equipo revocado (demo)'); return; }
  if(act==='onboard'){ closeOverlay(); showOnboarding(); return; }
  if(act==='toggle-theme'){ toggleTheme(); return; }
  if(act==='logout'){ showLogin(); return; }
  if(act==='role'){ setRole(el.getAttribute('data-role')); return; }
  if(act==='pickbranch'){ S.branch = +el.getAttribute('data-id'); showOnboarding(); return; }
  if(act==='link'){
    log('Equipo vinculado a '+branchName(S.branch), 'Sistema', branchName(S.branch), 'dispositivo: '+DEVICE);
    toast('Equipo vinculado a '+branchName(S.branch),'ok'); closeOverlay(); showLogin(); return;
  }
  if(act==='login'){
    S.role = el.getAttribute('data-role') || 'admin';
    S.screen = 'agenda'; S.date = iso(new Date());
    closeOverlay(); syncRoleUI(); render();
    log('Inicio de sesión', userLabel(), branchName(S.branch), 'equipo: '+DEVICE);
    toast('Bienvenido · '+(S.role==='admin'?'Administrador':'Anfitriona'),'ok'); return;
  }
});

document.addEventListener('change', function(e){
  var t = e.target;
  if(t.id==='newDate'){ S.draft.date = t.value; S.draft.start = null; renderNew(); return; }
  if(t.id==='newTime'){ S.draft.start = t.value===''?null:+t.value; return; }
  if(t.id==='newOrigin'){ S.draft.origin = t.value; renderNew(); return; }
  if(t.id==='newDrink'){ S.draft.drink = t.value; return; }
  if(t.id==='branchSelect'){ S.branch = +t.value; S.date = iso(new Date()); render(); toast('Sucursal activa: '+branchName(S.branch)); return; }
  if(t.getAttribute('data-act')==='rot'){ setRotation(t.value, t.getAttribute('data-date')); return; }
});
document.addEventListener('input', function(e){
  if(e.target.id==='newSearch'){ S.draft.q = e.target.value; updateResults(); }
  if(e.target.id==='newNotes'){ S.draft.notes = e.target.value; }
});
document.addEventListener('keydown', function(e){
  if(e.key==='Escape') closeOverlay();
});

function setRole(r){
  S.role = r;
  if(r==='hostess' && ['exportar','barberos'].indexOf(S.screen)>=0) S.screen = 'agenda';
  syncRoleUI(); render();
  toast(r==='admin'?'Perfil Administrador: acceso total':'Perfil Anfitriona: acceso limitado a '+branchName(S.branch), r==='admin'?'ok':'');
}
function syncRoleUI(){
  var btns = document.querySelectorAll('#roleSwitch button');
  for(var i=0;i<btns.length;i++){ btns[i].classList.toggle('on', btns[i].getAttribute('data-role')===S.role); }
}

/* ============================================================
   ARRANQUE
   ============================================================ */
function tick(){
  var d = new Date();
  var txt = d.toLocaleDateString('es-EC', {weekday:'short', day:'2-digit', month:'short'});
  byId('clock').innerHTML = '<b>'+hhmm(d.getHours()*60+d.getMinutes())+'</b> · '+txt;
}
function init(){
  seed();
  var sel = byId('branchSelect');
  BRANCHES.forEach(function(b){
    var o = document.createElement('option'); o.value = b.id; o.textContent = b.name; sel.appendChild(o);
  });
  sel.value = S.branch;
  try{ var th = localStorage.getItem('cave-theme'); if(th) S.theme = th; }catch(e){}
  setTheme(S.theme);
  byId('themeBtn').setAttribute('data-act','toggle-theme');
  var rs = document.querySelectorAll('#roleSwitch button');
  for(var i=0;i<rs.length;i++){ rs[i].setAttribute('data-act','role'); }
  tick(); setInterval(tick, 20000);
  render();
  showOnboarding();
}
init();






</script>
